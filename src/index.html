<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Zola Blog Editor</title>
<link rel="stylesheet" href="styles.css" />
<script type="importmap">
{
  "imports": {
    "marked": "https://cdn.jsdelivr.net/npm/marked/+esm"
  }
}
</script>
</head>
<body>

<div id="app">
  <div id="sidebar">
    <div id="sidebar-top">
      <div class="repo-label">
        <span>⌥ repository</span>
        <span class="repo-refresh" onclick="loadPosts()" title="Refresh file tree">↺</span>
      </div>
      <div id="repo-display" onclick="openSettings()" title="Click to change settings">
        <span id="repo-display-text">not connected</span>
        <span style="color:var(--text3);font-size:10px;">⚙</span>
      </div>
      <div id="sidebar-actions">
        <div class="action-row">
          <button onclick="newPost()" title="New post (Ctrl+N)">+ new file</button>
          <button onclick="newFolder()" title="New folder">+ new folder</button>
        </div>
        <div class="action-row">
          <button onclick="uploadFile()" title="Upload image to /static/images">↑ upload image</button>
          <button id="theme-btn" onclick="cycleTheme()" title="Switch theme">○ theme</button>
        </div>
      </div>
    </div>
    <div id="post-list"></div>
  </div>

  <div id="editor-pane">
    <div id="toolbar">
      <input type="text" id="post-title-input" placeholder="post title…" autocomplete="off" oninput="markDirty(); autoSlug()" />
      <button class="danger" onclick="unpublish()" id="unpub-btn" style="display:none">⊘ move back to draft</button>
      <div class="sep"></div>
      <button onclick="togglePreview()" id="preview-btn">◎ preview</button>
      <button onclick="saveDraft()" id="save-btn">⬡ publish draft</button>
      <button class="primary" onclick="publish()" id="pub-btn">→ publish</button>
    </div>
    <div id="frontmatter-bar">
      <label>slug <input type="text" id="fm-slug" autocomplete="off" oninput="markDirty(); window.slugEdited=true" /></label>
      <label>date <input type="text" id="fm-date" placeholder="2025-05-19" oninput="markDirty()" /></label>
      <label>tags <input type="text" id="fm-tags" oninput="markDirty()" /></label>
    </div>
    <div id="editor-area">
      <div id="md-editor-wrap">
        <div id="md-highlight" aria-hidden="true"></div>
        <textarea id="md-editor" spellcheck="false" placeholder="start writing in markdown…" oninput="markDirty(); updateHighlight(); updatePreview(); updateWordCount()"></textarea>
      </div>
      <div id="splitter"></div>
      <div id="preview-pane"></div>
    </div>
    <div id="statusbar">
      <span id="status-path">no post open</span>
      <span class="spacer"></span>
      <span id="status-words">0 words</span>
      <span id="status-chars">0 chars</span>
    </div>
  </div>
</div>

<div id="modal-overlay">
  <div id="modal">
    <h3 id="modal-title">GitHub settings</h3>
    <label>Personal access token (repo scope)</label>
    <div class="token-row">
      <input type="password" id="cfg-token" placeholder="ghp_…" autocomplete="off" />
      <button id="token-validate-btn" onclick="validateToken()">OK →</button>
    </div>
    <p class="hint">Create one at github.com/settings/tokens → Classic → check <em>repo</em>. Stored securely in your OS keychain via Tauri.</p>
    <label>Repository</label>
    <div id="repo-combobox">
      <input type="text" id="cfg-repo" placeholder="click OK to fetch repos…" autocomplete="off"
             oninput="filterRepos(this.value)" onfocus="showRepoDropdown()" onkeydown="repoKeydown(event)" />
      <div id="repo-dropdown"></div>
    </div>
    <label>Branch</label>
    <input type="text" id="cfg-branch" placeholder="main" />
    <label>Posts path</label>
    <input type="text" id="cfg-path" placeholder="content/blog" />
    <label>Site URL <span style="color:var(--text3);font-weight:400">(for preview links)</span></label>
    <input type="text" id="cfg-siteurl" placeholder="https://example.com" autocomplete="off" />
    <div id="modal-actions">
      <button id="modal-cancel-btn" onclick="closeModal()">cancel</button>
      <button class="primary" id="modal-ok-btn" onclick="modalOk()">connect →</button>
    </div>
  </div>
</div>

<div id="np-overlay">
  <div id="np-modal">
    <h3>New post</h3>
    <label>Create in</label>
    <select id="np-folder"></select>
    <label>Post title</label>
    <input type="text" id="np-title" placeholder="My new post" autocomplete="off"
           onkeydown="if(event.key==='Enter')window.confirmNewPost();if(event.key==='Escape')window.closeNewPostModal()" />
    <div id="np-actions">
      <button onclick="window.closeNewPostModal()">cancel</button>
      <button class="primary" onclick="window.confirmNewPost()">create →</button>
    </div>
  </div>
</div>

<div id="ul-overlay">
  <div id="ul-modal">
    <h3>Upload image</h3>
    <label>Destination</label>
    <div class="ul-dest-row">
      <span class="ul-base">static/images/</span>
      <input type="text" id="ul-subfolder" placeholder="2026/06" autocomplete="off" />
    </div>
    <label>File</label>
    <div class="ul-file-row">
      <input type="text" id="ul-filename" placeholder="no file chosen" readonly />
      <button onclick="document.getElementById('ul-file-input').click()">choose…</button>
    </div>
    <input type="file" id="ul-file-input" style="display:none"
           onchange="window.handleUploadFileSelect(this)" />
    <div id="ul-actions">
      <button onclick="window.closeUploadModal()">cancel</button>
      <button class="primary" id="ul-confirm-btn" onclick="window.confirmUpload()" disabled>↑ upload</button>
    </div>
  </div>
</div>

<div id="nf-overlay">
  <div id="nf-modal">
    <h3>New folder</h3>
    <label>Create inside</label>
    <select id="nf-parent"></select>
    <label>Folder name</label>
    <input type="text" id="nf-name" placeholder="my-section" autocomplete="off"
           onkeydown="if(event.key==='Enter')window.confirmNewFolder();if(event.key==='Escape')window.closeNewFolderModal()" />
    <div id="nf-actions">
      <button onclick="window.closeNewFolderModal()">cancel</button>
      <button class="primary" onclick="window.confirmNewFolder()">create →</button>
    </div>
  </div>
</div>

<div id="ctx-menu">
  <div class="ctx-item" id="ctx-new-post" onclick="window.ctxNewPost()">+ new post here</div>
  <div class="ctx-item" id="ctx-rename"   onclick="window.ctxRename()">✎ rename</div>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
